name: Build & Patch MGS131 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      server_url:
        description: 'رابط سيرفر PythonAnywhere (مثال: https://username.pythonanywhere.com)'
        required: false
        default: 'https://7snalhadi.pythonanywhere.com'

env:
  DEFAULT_SERVER_URL: 'https://7snalhadi.pythonanywhere.com'
  APK_FILE: 'MGS131_Final.apk'

jobs:
  build-and-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Pillow for image conversion
        run: python3 -m pip install --quiet pillow

      - name: Download Apktool & uber-apk-signer
        run: |
          mkdir -p tools
          curl -fsSL -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -fsSL -o tools/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Decompile APK
        run: |
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: $APK_FILE not found in repository root!"
            exit 1
          fi
          java -jar tools/apktool.jar d -f "$APK_FILE" -o decompiled_apk

      - name: Patch Server License, Branding, Icons & Contacts
        env:
          TARGET_URL: ${{ github.event.inputs.server_url || env.DEFAULT_SERVER_URL }}
        run: |
          python3 - <<'EOF'
          import glob
          import os
          import re
          from PIL import Image

          server_url = os.environ["TARGET_URL"].rstrip("/")
          print(f"Using server URL: {server_url}")

          # ---------------------------------------------------------
          # 1. تحديث الأيقونة (icon) والشعار الداخلي (logo)
          # ---------------------------------------------------------
          def find_root_image(base_name):
              for ext in ["png", "jpg", "jpeg", "webp", ""]:
                  candidate = f"{base_name}.{ext}" if ext else base_name
                  if os.path.isfile(candidate):
                      return candidate
              return None

          icon_src = find_root_image("icon")
          logo_src = find_root_image("logo")

          if icon_src:
              print(f"Found root icon: {icon_src}")
              drawable_nodpi = "decompiled_apk/res/drawable-nodpi"
              os.makedirs(drawable_nodpi, exist_ok=True)
              custom_icon_path = os.path.join(drawable_nodpi, "rider_assitant_icon.png")
              with Image.open(icon_src) as im:
                  im.convert("RGBA").save(custom_icon_path, "PNG")

              manifest_path = "decompiled_apk/AndroidManifest.xml"
              with open(manifest_path, "r", encoding="utf-8") as f:
                  manifest = f.read()
              manifest = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/rider_assitant_icon"', manifest)
              manifest = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/rider_assitant_icon"', manifest)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)
              print("Updated AndroidManifest.xml icon & roundIcon to @drawable/rider_assitant_icon")
          else:
              print("Warning: No icon.* found in repo root, keeping original launcher icon.")

          if logo_src:
              print(f"Found root logo: {logo_src}")
              # استبدال vendor.jpg (الاسم المفكوك لـ DQ.jpg) أو أي ملف logo/DQ كبير داخل res
              logo_targets = []
              for pat in ["decompiled_apk/res/**/vendor.*", "decompiled_apk/res/**/DQ.*", "decompiled_apk/res/**/*logo*"]:
                  logo_targets.extend(glob.glob(pat, recursive=True))
              if not logo_targets:
                  for root, _, files in os.walk("decompiled_apk/res"):
                      for fn in files:
                          fp = os.path.join(root, fn)
                          if fn.lower().endswith((".jpg", ".jpeg", ".png", ".webp")) and "rider_assitant_icon" not in fn and os.path.getsize(fp) > 10000:
                              logo_targets.append(fp)
              logo_targets = sorted(set(logo_targets))
              print(f"Logo targets found: {logo_targets}")
              with Image.open(logo_src) as im:
                  rgb_im = im.convert("RGB")
                  for target in logo_targets:
                      if target.endswith(".jpg") or target.endswith(".jpeg"):
                          rgb_im.save(target, "JPEG", quality=95)
                      else:
                          im.convert("RGBA").save(target, "PNG")
                      print(f"Replaced in-app logo: {target}")
          else:
              print("Warning: No logo.* found in repo root, keeping original in-app logo.")

          # ---------------------------------------------------------
          # 2. تحديث النصوص في كل اللغات (res/values*/strings.xml)
          # ---------------------------------------------------------
          xml_updated = 0
          for strings_path in glob.glob("decompiled_apk/res/values*/strings.xml"):
              with open(strings_path, "r", encoding="utf-8") as f:
                  xml = f.read()
              new_xml = xml.replace("MGS Assistant", "Rider Assitant").replace("STC Pay", "Barq")
              if new_xml != xml:
                  with open(strings_path, "w", encoding="utf-8") as f:
                      f.write(new_xml)
                  xml_updated += 1
          print(f"Updated branding & Barq in {xml_updated} strings.xml file(s).")

          # ---------------------------------------------------------
          # 3. تحديث نصوص الكود في ملفات smali (تليجرام، واتساب، Barq، الاسم)
          # ---------------------------------------------------------
          smali_replacements = [
              ("@Gufran3729", "@slayer23051"),
              ("https://t.me/Gufran3729", "https://t.me/slayer23051"),
              ("tg://resolve?domain=Gufran3729", "tg://resolve?domain=slayer23051"),
              ("https://wa.me/919506429166?text=", "https://wa.me/966511962678?text="),
              ("919506429166", "966511962678"),
              ("0510316786", "+966511962678"),
              ("MGS Assistant", "Rider Assitant"),
              ("STC Pay", "Barq"),
          ]

          smali_updated = 0
          for root, _, files in os.walk("decompiled_apk"):
              for name in files:
                  if not name.endswith(".smali"):
                      continue
                  fpath = os.path.join(root, name)
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  updated = content
                  for old, new in smali_replacements:
                      if old in updated:
                          updated = updated.replace(old, new)
                  if updated != content:
                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(updated)
                      smali_updated += 1
          print(f"Updated contact/branding strings in {smali_updated} smali file(s).")

          # ---------------------------------------------------------
          # 4. التأكد من صلاحية INTERNET في AndroidManifest.xml
          # ---------------------------------------------------------
          manifest_path = "decompiled_apk/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()
          if "android.permission.INTERNET" not in manifest:
              manifest = manifest.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1,
              )
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(manifest)

          # ---------------------------------------------------------
          # 5. حقن ServerLicenseClient وربط LicenseBridge بالسيرفر
          # ---------------------------------------------------------
          matches = glob.glob("decompiled_apk/smali*/dev/jing/dispatchkit/license/LicenseBridge.smali")
          if not matches:
              raise FileNotFoundError("LicenseBridge.smali not found in decompiled_apk!")

          bridge_path = matches[0]
          license_dir = os.path.dirname(bridge_path)
          print(f"Found LicenseBridge: {bridge_path}")

          client_smali = f""".class public final Ldev/jing/dispatchkit/license/ServerLicenseClient;
          .super Ljava/lang/Object;

          .field private static final SERVER_URL:Ljava/lang/String; = "{server_url}"
          .field private static lastKey:Ljava/lang/String;
          .field private static lastDeviceId:Ljava/lang/String;
          .field private static volatile lastResult:I
          .field private static volatile lastCheckMs:J

          .method static constructor <clinit>()V
              .locals 2
              const/4 v0, 0x1
              sput v0, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastResult:I
              const-wide/16 v0, 0x0
              sput-wide v0, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastCheckMs:J
              return-void
          .end method

          .method public constructor <init>()V
              .locals 0
              invoke-direct {{p0}}, Ljava/lang/Object;-><init>()V
              return-void
          .end method

          .method public static getLastResult()I
              .locals 1
              sget v0, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastResult:I
              return v0
          .end method

          .method public static verifyKey(Ljava/lang/String;Ljava/lang/String;)I
              .locals 8
              const/4 v0, 0x1

              if-eqz p0, :cond_ret_err
              invoke-virtual {{p0}}, Ljava/lang/String;->trim()Ljava/lang/String;
              move-result-object p0
              invoke-virtual {{p0}}, Ljava/lang/String;->length()I
              move-result v1
              if-eqz v1, :cond_ret_err

              if-eqz p1, :cond_ret_err
              invoke-virtual {{p1}}, Ljava/lang/String;->trim()Ljava/lang/String;
              move-result-object p1
              invoke-virtual {{p1}}, Ljava/lang/String;->length()I
              move-result v1
              if-eqz v1, :cond_ret_err

              # التحقق من الكاش لمدة 60 ثانية
              sget-object v1, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastKey:Ljava/lang/String;
              if-eqz v1, :cond_call_server
              invoke-virtual {{p0, v1}}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
              move-result v1
              if-eqz v1, :cond_call_server

              sget-object v1, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastDeviceId:Ljava/lang/String;
              if-eqz v1, :cond_call_server
              invoke-virtual {{p1, v1}}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
              move-result v1
              if-eqz v1, :cond_call_server

              invoke-static {{}}, Ljava/lang/System;->currentTimeMillis()J
              move-result-wide v2
              sget-wide v4, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastCheckMs:J
              sub-long/2addr v2, v4
              const-wide/32 v4, 0xea60
              cmp-long v1, v2, v4
              if-gez v1, :cond_call_server

              sget v0, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastResult:I
              return v0

          :cond_call_server
              const/4 v1, 0x1
              new-array v1, v1, [I
              const/4 v2, 0x0
              aput v0, v1, v2

              :try_start
              new-instance v2, Ldev/jing/dispatchkit/license/ServerLicenseClient$Worker;
              invoke-direct {{v2, p0, p1, v1}}, Ldev/jing/dispatchkit/license/ServerLicenseClient$Worker;-><init>(Ljava/lang/String;Ljava/lang/String;[I)V
              invoke-virtual {{v2}}, Ljava/lang/Thread;->start()V
              const-wide/16 v3, 0x2710
              invoke-virtual {{v2, v3, v4}}, Ljava/lang/Thread;->join(J)V
              :try_end
              .catch Ljava/lang/Throwable; {{:try_start .. :try_end}} :catch_err

          :catch_err
              const/4 v2, 0x0
              aget v0, v1, v2
              sput-object p0, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastKey:Ljava/lang/String;
              sput-object p1, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastDeviceId:Ljava/lang/String;
              sput v0, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastResult:I
              invoke-static {{}}, Ljava/lang/System;->currentTimeMillis()J
              move-result-wide v2
              sput-wide v2, Ldev/jing/dispatchkit/license/ServerLicenseClient;->lastCheckMs:J
              return v0

          :cond_ret_err
              return v0
          .end method
          """

          worker_smali = f""".class public final Ldev/jing/dispatchkit/license/ServerLicenseClient$Worker;
          .super Ljava/lang/Thread;

          .field private final key:Ljava/lang/String;
          .field private final deviceId:Ljava/lang/String;
          .field private final out:[I

          .method public constructor <init>(Ljava/lang/String;Ljava/lang/String;[I)V
              .locals 0
              invoke-direct {{p0}}, Ljava/lang/Thread;-><init>()V
              iput-object p1, p0, Ldev/jing/dispatchkit/license/ServerLicenseClient$Worker;->key:Ljava/lang/String;
              iput-object p2, p0, Ldev/jing/dispatchkit/license/ServerLicenseClient$Worker;->deviceId:Ljava/lang/String;
              iput-object p3, p0, Ldev/jing/dispatchkit/license/ServerLicenseClient$Worker;->out:[I
              return-void
          .end method

          .method public run()V
              .locals 7
              const/4 v0, 0x0
              :try_start
              new-instance v1, Ljava/net/URL;
              const-string v2, "{server_url}/api/activate"
              invoke-direct {{v1, v2}}, Ljava/net/URL;-><init>(Ljava/lang/String;)V

              invoke-virtual {{v1}}, Ljava/net/URL;->openConnection()Ljava/net/URLConnection;
              move-result-object v1
              check-cast v1, Ljava/net/HttpURLConnection;

              const-string v2, "POST"
              invoke-virtual {{v1, v2}}, Ljava/net/HttpURLConnection;->setRequestMethod(Ljava/lang/String;)V
              const/16 v2, 0x1f40
              invoke-virtual {{v1, v2}}, Ljava/net/HttpURLConnection;->setConnectTimeout(I)V
              invoke-virtual {{v1, v2}}, Ljava/net/HttpURLConnection;->setReadTimeout(I)V
              const/4 v2, 0x1
              invoke-virtual {{v1, v2}}, Ljava/net/HttpURLConnection;->setDoOutput(Z)V
              const-string v3, "Content-Type"
              const-string v4, "application/json; charset=UTF-8"
              invoke-virtual {{v1, v3, v4}}, Ljava/net/HttpURLConnection;->setRequestProperty(Ljava/lang/String;Ljava/lang/String;)V

              new-instance v3, Lorg/json/JSONObject;
              invoke-direct {{v3}}, Lorg/json/JSONObject;-><init>()V
              const-string v4, "key"
              iget-object v5, p0, Ldev/jing/dispatchkit/license/ServerLicenseClient$Worker;->key:Ljava/lang/String;
              invoke-virtual {{v3, v4, v5}}, Lorg/json/JSONObject;->put(Ljava/lang/String;Ljava/lang/Object;)Lorg/json/JSONObject;
              const-string v4, "device_id"
              iget-object v5, p0, Ldev/jing/dispatchkit/license/ServerLicenseClient$Worker;->deviceId:Ljava/lang/String;
              invoke-virtual {{v3, v4, v5}}, Lorg/json/JSONObject;->put(Ljava/lang/String;Ljava/lang/Object;)Lorg/json/JSONObject;

              invoke-virtual {{v3}}, Lorg/json/JSONObject;->toString()Ljava/lang/String;
              move-result-object v3
              sget-object v4, Ljava/nio/charset/StandardCharsets;->UTF_8:Ljava/nio/charset/Charset;
              invoke-virtual {{v3, v4}}, Ljava/lang/String;->getBytes(Ljava/nio/charset/Charset;)[B
              move-result-object v3

              invoke-virtual {{v1}}, Ljava/net/HttpURLConnection;->getOutputStream()Ljava/io/OutputStream;
              move-result-object v4
              invoke-virtual {{v4, v3}}, Ljava/io/OutputStream;->write([B)V
              invoke-virtual {{v4}}, Ljava/io/OutputStream;->flush()V
              invoke-virtual {{v4}}, Ljava/io/OutputStream;->close()V

              invoke-virtual {{v1}}, Ljava/net/HttpURLConnection;->getResponseCode()I
              move-result v3
              invoke-virtual {{v1}}, Ljava/net/HttpURLConnection;->disconnect()V

              const/16 v4, 0xc8
              if-ne v3, v4, :cond_done
              iget-object v3, p0, Ldev/jing/dispatchkit/license/ServerLicenseClient$Worker;->out:[I
              aput v0, v3, v0
              :try_end
              .catch Ljava/lang/Throwable; {{:try_start .. :try_end}} :catch_err

          :cond_done
              return-void

          :catch_err
              return-void
          .end method
          """

          client_smali = "\n".join(line[10:] if line.startswith("          ") else line for line in client_smali.splitlines()) + "\n"
          worker_smali = "\n".join(line[10:] if line.startswith("          ") else line for line in worker_smali.splitlines()) + "\n"

          with open(os.path.join(license_dir, "ServerLicenseClient.smali"), "w", encoding="utf-8") as f:
              f.write(client_smali)
          with open(os.path.join(license_dir, "ServerLicenseClient$Worker.smali"), "w", encoding="utf-8") as f:
              f.write(worker_smali)

          with open(bridge_path, "r", encoding="utf-8") as f:
              smali = f.read()

          def replace_method(code, method_name, body):
              pattern = rf"(\.method[^\n]*\b{method_name}\([^\n]*\)I\n)(.*?)(\n\.end method)"
              new_code, count = re.subn(pattern, rf"\1{body}\3", code, flags=re.DOTALL)
              print(f"Patched {method_name}: {count} occurrence(s)")
              return new_code

          smali = replace_method(
              smali,
              "check",
              "    .locals 1\n"
              "    invoke-static {p3, p4}, Ldev/jing/dispatchkit/license/ServerLicenseClient;->verifyKey(Ljava/lang/String;Ljava/lang/String;)I\n"
              "    move-result v0\n"
              "    return v0"
          )

          smali = replace_method(
              smali,
              "allowRequest",
              "    .locals 1\n"
              "    invoke-static {}, Ldev/jing/dispatchkit/license/ServerLicenseClient;->getLastResult()I\n"
              "    move-result v0\n"
              "    return v0"
          )

          smali = replace_method(
              smali,
              "consumeNativeApproval",
              "    .locals 1\n"
              "    invoke-static {}, Ldev/jing/dispatchkit/license/ServerLicenseClient;->getLastResult()I\n"
              "    move-result v0\n"
              "    return v0"
          )

          with open(bridge_path, "w", encoding="utf-8") as f:
              f.write(smali)
          EOF

      - name: Rebuild APK & Restore META-INF/xposed
        run: |
          java -jar tools/apktool.jar b decompiled_apk -o unsigned.apk
          python3 - <<'PYEOF'
          import zipfile

          with zipfile.ZipFile("MGS131_Final.apk", "r") as src_apk,                zipfile.ZipFile("unsigned.apk", "a", compression=zipfile.ZIP_DEFLATED) as dst_apk:
              existing = set(dst_apk.namelist())
              restored = 0
              for name in src_apk.namelist():
                  if name.startswith("META-INF/xposed/") and not name.endswith("/") and name not in existing:
                      dst_apk.writestr(name, src_apk.read(name))
                      restored += 1
              print(f"Restored {restored} META-INF/xposed/ file(s) into unsigned.apk")
          PYEOF

      - name: Sign APK
        run: |
          mkdir -p output_apk
          java -jar tools/uber-apk-signer.jar --apks unsigned.apk --out output_apk
          ls -la output_apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Rider_Assitant_Patched_Signed
          path: output_apk/*.apk
