      - name: Rebuild AWS APK & Restore META-INF/xposed
        run: |
          java -jar tools/apktool.jar b decompiled_aws -o unsigned_aws.apk
          python3 - <<'PYEOF'
          import zipfile

          with zipfile.ZipFile("AWS_6.2.0 fix 4_edit.apk", "r") as src_apk, \
               zipfile.ZipFile("unsigned_aws.apk", "a", compression=zipfile.ZIP_DEFLATED) as dst_apk:
              existing = set(dst_apk.namelist())
              restored = 0
              for name in src_apk.namelist():
                  if name.startswith("META-INF/xposed/") and not name.endswith("/") and name not in existing:
                      dst_apk.writestr(name, src_apk.read(name))
                      restored += 1
              print(f"Restored {restored} META-INF/xposed/ file(s) into unsigned_aws.apk")
          PYEOF

      - name: Sign AWS APK
        run: |
          mkdir -p output_aws
          java -jar tools/uber-apk-signer.jar --apks unsigned_aws.apk --out output_aws
          ls -la output_aws

      - name: Upload Patched AWS APK
        uses: actions/upload-artifact@v4
        with:
          name: AWS_Patched_Signed
          path: output_aws/*.apk
