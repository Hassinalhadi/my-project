name: Build & Patch AWS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'AWS_6.2.0 fix 4_edit.apk'
      - '.github/workflows/build_aws.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'رابط سيرفر PythonAnywhere (مثال: https://username.pythonanywhere.com)'
        required: false
        default: 'https://7snalhadi.pythonanywhere.com'

env:
  DEFAULT_SERVER_URL: 'https://7snalhadi.pythonanywhere.com'
  APK_FILE: 'AWS_6.2.0 fix 4_edit.apk'

jobs:
  build-and-patch-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Apktool & uber-apk-signer
        run: |
          mkdir -p tools
          curl -fsSL -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -fsSL -o tools/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Decompile AWS APK
        run: |
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: $APK_FILE not found in repository root!"
            exit 1
          fi
          java -jar tools/apktool.jar d -f -r "$APK_FILE" -o decompiled_aws

      - name: Patch AWS Server License, Anti-Tamper & Login UI
        env:
          TARGET_URL: ${{ github.event.inputs.server_url || env.DEFAULT_SERVER_URL }}
        run: |
          python3 - <<'EOF'
          import glob
          import os
          import re
          import textwrap

          server_url = os.environ["TARGET_URL"].rstrip("/")
          print(f"Using server URL: {server_url}")

          # 1. حقن ServerLicenseClient وملحقاته في smali_classes3/com/driver/assistant/hook/
          hook_dir = "decompiled_aws/smali_classes3/com/driver/assistant/hook"
          os.makedirs(hook_dir, exist_ok=True)

